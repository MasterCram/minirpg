<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniRPG - 2D Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        #ui {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            border: 2px solid #444;
            z-index: 1000;
        }
        #ui div {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div><strong>Controls:</strong></div>
        <div>• Click to move</div>
        <div>• Click resources to gather</div>
        <div>• Right-click inventory to drop</div>
        <div>• Drag items to reorder</div>
        <div id="player-count" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">Players online: 0</div>
    </div>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/config.js"></script>
    <script src="PathFinder.js"></script>
    <script src="Player.js"></script>
    <script src="Resource.js"></script>
    <script src="DroppedItem.js"></script>
    <script src="InventoryUI.js"></script>
    <script src="game.js"></script>
</body>
</html>
